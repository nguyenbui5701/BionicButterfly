<text x="704" y="132" class="hd">B — horn / rod / separate pivot</text>
<rect x="747" y="285" width="128" height="83" rx="10" fill="#cebdec" stroke="#7a61a3" stroke-width="3"/><text x="766" y="332" font-size="19">servo</text>
