<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 570">
<rect width="1250" height="570" fill="#fbfcff"/>
<style>text{font-family:Arial,sans-serif;fill:#25354b}.title{font-size:27;font-weight:bold}.hd{font-size:23;font-weight:bold}.note{font-size:17;fill:#54657b}.line{stroke:#395575;stroke-width:5;fill:none}.pivot{fill:#ffffff;stroke:#213c5c;stroke-width:4}.d{stroke:#718096;stroke-dasharray:7 6;stroke-width:2}</style>
<text x="44" y="53" class="title">Wing root mechanical trade: A direct drive vs B supported linkage</text>
