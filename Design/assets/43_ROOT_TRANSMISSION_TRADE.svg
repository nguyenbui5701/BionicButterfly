<rect x="674" y="95" width="530" height="395" rx="16" fill="#f3f8eb" stroke="#c8d7b4"/>
<text x="75" y="132" class="hd">A — servo shaft at wing root</text>
<rect x="180" y="250" width="130" height="94" rx="11" fill="#cebdec" stroke="#7a61a3" stroke-width="3"/><text x="196" y="305" font-size="19">servo</text>
