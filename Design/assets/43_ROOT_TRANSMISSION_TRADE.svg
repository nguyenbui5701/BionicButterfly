<circle cx="1051" cy="305" r="20" class="pivot"/><line x1="1051" y1="305" x2="1050" y2="248" class="line"/><path d="M 1067 290 L 1180 176" class="line" stroke="#0e7490"/><path d="M 1070 316 L 1190 367" class="line" stroke="#0e7490"/>
<text x="738" y="407" class="note">Pivot takes bending reaction; linkage drives flap</text>
