[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-host-safety-priority-kernel"
version = "0.1.0"
description = "TASK-005 pure provisional Safety Priority Kernel Stage C1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bb-host-batch-observations==0.1.0", "bb-host-temporal-guard-facts==0.1.0"]

[project.optional-dependencies]
test = [
  "pytest==8.3.5", "colorama==0.4.6", "iniconfig==2.1.0",
  "packaging==25.0", "pluggy==1.6.0", "build==1.2.2.post1",
  "pyproject-hooks==1.2.0", "setuptools==80.9.0", "wheel==0.45.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
